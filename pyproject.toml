[project]
name = "afe-fleet"
version = "0.1.0"
description = "Distributed, cooperatively coordinated agent workers and admin over git"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
afe-fleet = "afe_fleet.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
